name: Update kite dashboard

on:
  schedule:
    # GitHub lance les crons planifiés avec ~4-5h de retard (observé : 6h UTC -> 10h-11h UTC).
    # On vise 0h17 (hors pic de l'heure pile) + un 2e passage de secours à 3h17, pour que le site
    # soit à jour avant le mail de notif (RemoteTrigger à 7h UTC).
    - cron: "17 0 */3 * *"
    - cron: "17 3 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build dashboard
        run: python3 build.py

      - name: Commit and push if changed
        run: |
          git config user.name "kite-lisbonne-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Auto-update wind dashboard"
            git push
          else
            echo "No changes, skipping commit."
          fi
